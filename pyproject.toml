[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "huggingface-agents-langgraph"
version = "0.1.0"
description = "A modular agent project for reproducible GAIA benchmark evaluation."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "datasets>=4,<5",
    "huggingface-hub>=0.34,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huggingface_agents_langgraph"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
