[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "huggingface-agents-langgraph"
version = "0.1.0"
description = "A modular agent project for reproducible GAIA benchmark evaluation."
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "datasets>=4,<5",
    "ddgs>=9,<10",
    "huggingface-hub>=0.34,<2",
    "langgraph>=1.2.12",
    "openpyxl>=3.1,<4",
    "psutil>=7,<8",
    "pypdf>=5,<7",
    "trafilatura>=2,<3",
]

[project.optional-dependencies]
multimedia = [
    "av>=14,<16",
    "faster-whisper>=1.1,<2",
    "librosa>=0.10,<1",
    "pillow>=11,<13",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "yt-dlp>=2025.3.31",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huggingface_agents_langgraph"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
# C901/PLR09xx keep functions small. Files listed under per-file-ignores hold the
# functions that already exceeded the limits before the gate existed: new code in
# every other file is held to it. Remove a file from the list when its functions are
# split; never add to it.
select = ["E", "F", "I", "UP", "B", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"scripts/analyze_experiments.py" = ["C901"]
"src/huggingface_agents_langgraph/answer_production.py" = ["C901"]
"src/huggingface_agents_langgraph/calculation.py" = ["C901"]
"src/huggingface_agents_langgraph/evidence_selection.py" = ["C901"]
"src/huggingface_agents_langgraph/experiment_runner.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/huggingface_agents_langgraph/experiments.py" = ["C901", "PLR0912", "PLR0915"]
"src/huggingface_agents_langgraph/llm.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/huggingface_agents_langgraph/multimedia_processing.py" = ["C901"]
"src/huggingface_agents_langgraph/research.py" = ["C901", "PLR0912"]
"src/huggingface_agents_langgraph/spreadsheet_processing.py" = ["C901", "PLR0912"]
"src/huggingface_agents_langgraph/spreadsheet_tools.py" = ["C901", "PLR0912"]
"src/huggingface_agents_langgraph/graph_definition/registry.py" = ["PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
