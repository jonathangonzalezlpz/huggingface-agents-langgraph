[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "huggingface-agents-langgraph"
version = "0.1.0"
description = "A modular agent project for reproducible GAIA benchmark evaluation."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "datasets>=4,<5",
    "ddgs>=9,<10",
    "huggingface-hub>=0.34,<2",
    "langgraph>=1.2.12",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
multimedia = [
    "av>=14,<16",
    "faster-whisper>=1.1,<2",
    "librosa>=0.10,<1",
    "pillow>=11,<13",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "yt-dlp>=2025.3.31",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huggingface_agents_langgraph"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
